name: CI

on:
  push:
    branches: [main, "sjstack/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Tests
        run: make test
      - name: Helm
        run: make helm-lint helm-template
      - name: Legacy demo
        run: make legacy-demo
