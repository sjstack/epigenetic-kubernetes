apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: epik
---
apiVersion: batch/v1
kind: Job
metadata:
  name: epik-run
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: epik-run
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: simulate
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          args: ["run-cross", "{{ .Values.cross }}", "--to-dap", "{{ .Values.toDap }}", "--seed", "{{ .Values.seed }}", "--out", "/artifacts"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: artifacts
          emptyDir: {}
