{{- if eq .Values.strategy "clonal" }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: clonal-organism
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.count }}
  selector:
    matchLabels:
      app: cell
      strategy: clonal
  template:
    metadata:
      labels:
        app: cell
        strategy: clonal
      annotations:
        # Initial epigenetic state: Unmethylated
        epigenetic-mark.science/methylation-level: "0"
    spec:
      containers:
      - name: cell-process
        image: {{ .Values.image }}
        command: ["python", "-c", "import time; print('Cell functioning...'); time.sleep(3600)"]
        resources:
          requests:
            cpu: {{ printf "%dm" (int .Values.baseCpu) }}
            memory: {{ printf "%dMi" (int .Values.baseMemory) }}

{{- else if eq .Values.strategy "transgenerational" }}
{{- range $i := until (int .Values.count) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: organism-{{ $i }}
  namespace: {{ $.Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cell
      lineage: {{ printf "organism-%d" $i | quote }}
      strategy: transgenerational
  template:
    metadata:
      labels:
        app: cell
        lineage: {{ printf "organism-%d" $i | quote }}
        strategy: transgenerational
      annotations:
        epigenetic-mark.science/methylation-level: "0"
    spec:
      containers:
      - name: cell-process
        image: {{ $.Values.image }}
        command: ["python", "-c", "import time; print('Cell functioning...'); time.sleep(3600)"]
        resources:
          requests:
            cpu: {{ printf "%dm" (int $.Values.baseCpu) }}
            memory: {{ printf "%dMi" (int $.Values.baseMemory) }}
---
{{- end }}
{{- end }}
